<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator Automated Test Suite</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: #fff; padding: 30px; }
        .test-case { background: #2a2a2a; padding: 15px; margin-bottom: 10px; border-radius: 8px; border-left: 5px solid #ccc; }
        .pass { border-left-color: #2ecc71; }
        .fail { border-left-color: #e74c3c; }
        .status { font-weight: bold; margin-left: 10px; }
        .status.pass-text { color: #2ecc71; }
        .status.fail-text { color: #e74c3c; }
        #summary { font-size: 20px; font-weight: bold; margin-bottom: 20px; padding: 15px; border-radius: 8px; background: #333; }
    </style>
</head>
<body>
    <h1>Calculator Automated Test Suite</h1>
    <div id="summary">Running tests...</div>
    <div id="results"></div>

    <script>
        // --- Calculator Code under Test (Embedded directly to bypass cross-origin iframe security) ---
        let currentOperand = '0';
        let previousOperand = '';
        let operation = undefined;

        function clearDisplay() {
            currentOperand = '0';
            previousOperand = '';
            operation = undefined;
        }

        function appendNumber(number) {
            if (number === '.' && currentOperand.includes('.')) return;
            if (currentOperand === '0' && number !== '.') {
                currentOperand = number.toString();
            } else {
                currentOperand = currentOperand.toString() + number.toString();
            }
        }

        function chooseOperator(op) {
            if (currentOperand === '') return;
            if (previousOperand !== '') {
                compute();
            }
            operation = op;
            previousOperand = currentOperand;
            currentOperand = '0';
        }

        function compute() {
            let computation;
            const prev = parseFloat(previousOperand);
            const current = parseFloat(currentOperand);
            if (isNaN(prev) || isNaN(current)) return;
            switch (operation) {
                case '+':
                    computation = prev + current;
                    break;
                case '-':
                    computation = prev - current;
                    break;
                case '*':
                    computation = prev * current;
                    break;
                case '/':
                    computation = prev / current;
                    break;
                default:
                    return;
            }
            currentOperand = computation.toString();
            operation = undefined;
            previousOperand = '';
        }

        function toggleSign() {
            currentOperand = (parseFloat(currentOperand) * -1).toString();
        }

        function percentage() {
            currentOperand = (parseFloat(currentOperand) / 100).toString();
        }

        // --- Automated Test Framework & Cases ---
        const tests = [];
        function test(name, fn) { tests.push({ name, fn }); }

        test("Initial display should be 0", () => {
            clearDisplay();
            return currentOperand === '0';
        });

        test("Append numbers 7, 8, 9", () => {
            clearDisplay();
            appendNumber('7');
            appendNumber('8');
            appendNumber('9');
            return currentOperand === '789';
        });

        test("Addition: 5 + 3 = 8", () => {
            clearDisplay();
            appendNumber('5');
            chooseOperator('+');
            appendNumber('3');
            compute();
            return currentOperand === '8';
        });

        test("Subtraction: 10 - 4 = 6", () => {
            clearDisplay();
            appendNumber('1');
            appendNumber('0');
            chooseOperator('-');
            appendNumber('4');
            compute();
            return currentOperand === '6';
        });

        test("Multiplication: 6 * 7 = 42", () => {
            clearDisplay();
            appendNumber('6');
            chooseOperator('*');
            appendNumber('7');
            compute();
            return currentOperand === '42';
        });

        test("Division: 15 / 3 = 5", () => {
            clearDisplay();
            appendNumber('1');
            appendNumber('5');
            chooseOperator('/');
            appendNumber('3');
            compute();
            return currentOperand === '5';
        });

        test("Toggle sign: 5 to -5", () => {
            clearDisplay();
            appendNumber('5');
            toggleSign();
            return currentOperand === '-5';
        });

        test("Percentage: 50% = 0.5", () => {
            clearDisplay();
            appendNumber('5');
            appendNumber('0');
            percentage();
            return currentOperand === '0.5';
        });

        // Run suite
        window.onload = function() {
            let passedCount = 0;
            const resultsContainer = document.getElementById('results');
            
            tests.forEach(t => {
                const div = document.createElement('div');
                div.className = 'test-case';
                let passed = false;
                try {
                    passed = t.fn();
                } catch(e) {
                    passed = false;
                }

                if (passed) {
                    passedCount++;
                    div.classList.add('pass');
                    div.innerHTML = `<strong>TEST PASSED:</strong> ${t.name} <span class="status pass-text">[PASS]</span>`;
                } else {
                    div.classList.add('fail');
                    div.innerHTML = `<strong>TEST FAILED:</strong> ${t.name} <span class="status fail-text">[FAIL]</span>`;
                }
                resultsContainer.appendChild(div);
            });

            document.getElementById('summary').innerText = `Results: ${passedCount} / ${tests.length} Passed`;
        };
    </script>
</body>
</html>

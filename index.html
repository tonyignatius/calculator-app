<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standalone Elegant Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #141e30, #243b55);
        }
        .calculator {
            background-color: #1e222b;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 340px;
        }
        .display {
            background-color: #2c313c;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: right;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
        }
        .display-previous {
            color: #7f8c8d;
            font-size: 14px;
            min-height: 18px;
            word-wrap: break-word;
            word-break: break-all;
            margin-bottom: 5px;
        }
        .display-current {
            color: #ffffff;
            font-size: 32px;
            font-weight: 600;
            overflow-x: auto;
            white-space: nowrap;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        button {
            border: none;
            border-radius: 12px;
            padding: 18px;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            outline: none;
        }
        button:active {
            transform: scale(0.95);
        }
        .btn-number {
            background-color: #3e4451;
            color: #ffffff;
        }
        .btn-number:hover {
            background-color: #4c5363;
        }
        .btn-operator {
            background-color: #ff9f0a;
            color: #ffffff;
        }
        .btn-operator:hover {
            background-color: #cc7f08;
        }
        .btn-function {
            background-color: #a5b1c2;
            color: #2c3e50;
        }
        .btn-function:hover {
            background-color: #cbd5e1;
        }
        .btn-equal {
            grid-column: span 2;
            background-color: #ff9f0a;
            color: #ffffff;
        }
        .btn-equal:hover {
            background-color: #cc7f08;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div class="display-previous" id="previous-op"></div>
            <div class="display-current" id="display">0</div>
        </div>
        <div class="buttons">
            <button class="btn-function" onclick="clearDisplay()">C</button>
            <button class="btn-function" onclick="toggleSign()">+/-</button>
            <button class="btn-function" onclick="percentage()">%</button>
            <button class="btn-operator" onclick="chooseOperator('/')">&divide;</button>
            
            <button class="btn-number" onclick="appendNumber('7')">7</button>
            <button class="btn-number" onclick="appendNumber('8')">8</button>
            <button class="btn-number" onclick="appendNumber('9')">9</button>
            <button class="btn-operator" onclick="chooseOperator('*')">&times;</button>
            
            <button class="btn-number" onclick="appendNumber('4')">4</button>
            <button class="btn-number" onclick="appendNumber('5')">5</button>
            <button class="btn-number" onclick="appendNumber('6')">6</button>
            <button class="btn-operator" onclick="chooseOperator('-')">&minus;</button>
            
            <button class="btn-number" onclick="appendNumber('1')">1</button>
            <button class="btn-number" onclick="appendNumber('2')">2</button>
            <button class="btn-number" onclick="appendNumber('3')">3</button>
            <button class="btn-operator" onclick="chooseOperator('+')">+</button>
            
            <button class="btn-number" onclick="appendNumber('0')">0</button>
            <button class="btn-number" onclick="appendNumber('.')">.</button>
            <button class="btn-equal" id="equals-btn" onclick="compute()">=</button>
        </div>
    </div>

    <script>
        let currentOperand = '0';
        let previousOperand = '';
        let operation = undefined;

        const displayElement = document.getElementById('display');
        const previousOpElement = document.getElementById('previous-op');

        function updateDisplay() {
            displayElement.innerText = currentOperand;
            if (operation != null) {
                previousOpElement.innerText = `${previousOperand} ${operation}`;
            } else {
                previousOpElement.innerText = '';
            }
        }

        function clearDisplay() {
            currentOperand = '0';
            previousOperand = '';
            operation = undefined;
            updateDisplay();
        }

        function appendNumber(number) {
            if (number === '.' && currentOperand.includes('.')) return;
            if (currentOperand === '0' && number !== '.') {
                currentOperand = number.toString();
            } else {
                currentOperand = currentOperand.toString() + number.toString();
            }
            updateDisplay();
        }

        function chooseOperator(op) {
            if (currentOperand === '') return;
            if (previousOperand !== '') {
                compute();
            }
            operation = op;
            previousOperand = currentOperand;
            currentOperand = '0';
            updateDisplay();
        }

        function compute() {
            let computation;
            const prev = parseFloat(previousOperand);
            const current = parseFloat(currentOperand);
            if (isNaN(prev) || isNaN(current)) return;
            switch (operation) {
                case '+':
                    computation = prev + current;
                    break;
                case '-':
                    computation = prev - current;
                    break;
                case '*':
                    computation = prev * current;
                    break;
                case '/':
                    computation = prev / current;
                    break;
                default:
                    return;
            }
            currentOperand = computation.toString();
            operation = undefined;
            previousOperand = '';
            updateDisplay();
        }

        function toggleSign() {
            currentOperand = (parseFloat(currentOperand) * -1).toString();
            updateDisplay();
        }

        function percentage() {
            currentOperand = (parseFloat(currentOperand) / 100).toString();
            updateDisplay();
        }
    </script>
</body>
</html>
